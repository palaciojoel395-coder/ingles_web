 {% extends "base.html" %}

{% block content %}

<style>

/* Fondo animado */
body {
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c1c);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    color: white;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Hero */
.hero {
    text-align: center;
    padding: 60px 20px;
}

.hero h1 {
    font-size: 42px;
}

.hero p {
    font-size: 18px;
    opacity: 0.8;
}

/* Tarjeta tipo glass */
.pronunciation-section {
    margin: 40px auto;
    padding: 40px;
    width: 85%;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.pronunciation-section h2 {
    text-align: center;
    margin-bottom: 30px;
}

.word {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
}

.word button {
    background: #00c6ff;
    border: none;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.word button:hover {
    background: #0072ff;
    color: white;
}

</style>

<div class="hero">
    <h1>English & Cybersecurity Learning Platform</h1>
    <p>Improve your English with real cybersecurity vocabulary and pronunciation practice.</p>
</div>

<section class="pronunciation-section">
    <h2>🔐 Pronunciation Practice – 60+ Tech Words</h2>
    <div id="wordList"></div>
</section>

<script>

const words = [
["Password","ˈpæs.wɝːd"],
["Username","ˈjuːz.neɪm"],
["Firewall","ˈfaɪər.wɔːl"],
["Hacker","ˈhækər"],
["Malware","ˈmæl.weər"],
["Virus","ˈvaɪ.rəs"],
["Phishing","ˈfɪʃ.ɪŋ"],
["Encryption","ɪnˈkrɪp.ʃən"],
["Cyberattack","ˈsaɪ.bər əˌtæk"],
["Database","ˈdeɪ.tə.beɪs"],
["Cloud","klaʊd"],
["Server","ˈsɝː.vər"],
["Network","ˈnet.wɝːk"],
["Router","ˈraʊ.tər"],
["Antivirus","ˌæn.tiˈvaɪ.rəs"],
["Spyware","ˈspaɪ.weər"],
["Trojan","ˈtroʊ.dʒən"],
["Backup","ˈbæk.ʌp"],
["Update","ʌpˈdeɪt"],
["Download","ˌdaʊnˈloʊd"],
["Upload","ˈʌp.loʊd"],
["Digital","ˈdɪdʒ.ə.təl"],
["Software","ˈsɔːft.weər"],
["Hardware","ˈhɑːrd.weər"],
["Algorithm","ˈæl.ɡə.rɪð.əm"],
["Authentication","ɔːˌθen.tɪˈkeɪ.ʃən"],
["Cybersecurity","ˌsaɪ.bər sɪˈkjʊr.ə.ti"],
["Spam","spæm"],
["IP address","ˌaɪˈpiː əˈdres"],
["Domain","doʊˈmeɪn"],
["Link","lɪŋk"],
["Website","ˈweb.saɪt"],
["Browser","ˈbraʊ.zər"],
["Cookie","ˈkʊk.i"],
["VPN","ˌviː.piːˈen"],
["WiFi","ˈwaɪ.faɪ"],
["Bluetooth","ˈbluː.tuːθ"],
["Monitor","ˈmɒn.ɪ.tər"],
["Keyboard","ˈkiː.bɔːrd"],
["Mouse","maʊs"],
["Screen","skriːn"],
["Email","ˈiː.meɪl"],
["Attachment","əˈtætʃ.mənt"],
["Folder","ˈfoʊl.dər"],
["File","faɪl"],
["Cybercrime","ˈsaɪ.bər kraɪm"],
["Bot","bɒt"],
["Blockchain","ˈblɒk.tʃeɪn"],
["AI","ˌeɪˈaɪ"],
["Robot","ˈroʊ.bɒt"],
["Data","ˈdeɪ.tə"],
["Code","koʊd"],
["Program","ˈproʊ.ɡræm"],
["Developer","dɪˈvel.ə.pər"],
["System","ˈsɪs.təm"],
["Access","ˈæk.ses"],
["Security","sɪˈkjʊr.ə.ti"],
["Threat","θret"],
["Risk","rɪsk"],
["Protection","prəˈtek.ʃən"]
];

const container = document.getElementById("wordList");

words.forEach(word => {
    const div = document.createElement("div");
    div.className = "word";
    div.innerHTML = `
        <span><strong>${word[0]}</strong> — ${word[1]}</span>
        <button onclick="speak('${word[0]}')">🔊</button>
    `;
    container.appendChild(div);
});

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
}

</script>

{% endblock %}
