{% extends "base.html" %}

{% block content %}

<style>

/* Sección con fondo animado independiente */
.pronunciation-wrapper {
    padding: 40px;
    border-radius: 20px;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c1c);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    color: white;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.pronunciation-card {
    margin-top: 30px;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

.word {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.word button {
    background: #00c6ff;
    border: none;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.word button:hover {
    background: #0072ff;
    color: white;
}

</style>

<div class="pronunciation-wrapper">

    <h1>Cybersecurity English Pronunciation</h1>
    <p>Practice more than 60 technology and cybersecurity words.</p>

    <div class="pronunciation-card">
        <div id="wordList"></div>
    </div>

</div>

<script>

const words = [
["Password","ˈpæs.wɝːd"],
["Firewall","ˈfaɪər.wɔːl"],
["Hacker","ˈhækər"],
["Malware","ˈmæl.weər"],
["Virus","ˈvaɪ.rəs"],
["Phishing","ˈfɪʃ.ɪŋ"],
["Encryption","ɪnˈkrɪp.ʃən"],
["Cybersecurity","ˌsaɪ.bər sɪˈkjʊr.ə.ti"],
["Server","ˈsɝː.vər"],
["Network","ˈnet.wɝːk"],
["Cloud","klaʊd"],
["Database","ˈdeɪ.tə.beɪs"],
["VPN","ˌviː.piːˈen"],
["Antivirus","ˌæn.tiˈvaɪ.rəs"],
["Spyware","ˈspaɪ.weər"],
["Trojan","ˈtroʊ.dʒən"],
["Backup","ˈbæk.ʌp"],
["Update","ʌpˈdeɪt"],
["Download","ˌdaʊnˈloʊd"],
["Upload","ˈʌp.loʊd"]
];

const container = document.getElementById("wordList");

words.forEach(word => {
    const div = document.createElement("div");
    div.className = "word";
    div.innerHTML = `
        <span><strong>${word[0]}</strong> — ${word[1]}</span>
        <button onclick="speak('${word[0]}')">🔊</button>
    `;
    container.appendChild(div);
});

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
}

</script>

{% endblock %}
