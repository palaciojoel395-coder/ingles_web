<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Cyber English - Pronunciación</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.section-title{
    margin-top:40px;
    font-size:22px;
}

.word-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.1);
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.word-card:hover{
    background:rgba(255,255,255,0.2);
    transform:scale(1.02);
}

.word-card.active{
    background:#ff9800;
}

.word-text{
    text-align:left;
}

.pronunciation{
    font-size:14px;
    opacity:0.8;
}

.audio-icon{
    font-size:20px;
}
</style>
</head>

<body>

<header>
<h1>🔐 Cyber English</h1>
<a href="{{ url_for('inicio') }}">
<button>⬅ Volver</button>
</a>
</header>

<div style="max-width:900px;margin:auto;padding:20px;" id="content"></div>

<footer>
<p>© 2026 Yoel  Palacio Juarez</p> 
</footer>

};

const container=document.getElementById("content");

for(const section in sections){
    const title=document.createElement("h2");
    title.className="section-title";
    title.innerText=section;
    container.appendChild(title);

    sections[section].forEach(word=>{
        const div=document.createElement("div");
        div.className="word-card";
        div.innerHTML=`
            <div class="word-text">
                <strong>${word[0]}</strong><br>
                <span class="pronunciation">${word[1]}</span><br>
                <small>${word[2]}</small>
            </div>
            <div class="audio-icon">🎧</div>
        `;
        div.onclick=()=>speak(word[0],div);
        container.appendChild(div);
    });
}

 function speak(word, element){
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = "en-US";
    utter.rate = 0.7;

    const voices = speechSynthesis.getVoices();
    const englishVoice = voices.find(voice => 
        voice.lang === "en-US"
    );

    if (englishVoice) {
        utter.voice = englishVoice;
    }

    window.speechSynthesis.cancel();
    speechSynthesis.speak(utter);

    document.querySelectorAll(".word-card")
        .forEach(card => card.classList.remove("active"));
    element.classList.add("active");
}

</script>
