<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cybersecurity Pronunciation</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

/* Fondo animado */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c1c);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* Tarjeta estilo papel */
.container {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    margin: 50px auto;
    padding: 40px;
    width: 80%;
    border-radius: 20px;
    color: white;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.word {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

button {
    background: #00c6ff;
    border: none;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #0072ff;
    color: white;
}

</style>
</head>

<body>

<div class="container">
<h1>🔐 Cybersecurity & Technology Pronunciation</h1>

<div id="wordList"></div>

</div>

<script>

const words = [
["Password","ˈpæs.wɝːd"],
["Username","ˈjuːz.neɪm"],
["Firewall","ˈfaɪər.wɔːl"],
["Hacker","ˈhækər"],
["Malware","ˈmæl.weər"],
["Virus","ˈvaɪ.rəs"],
["Phishing","ˈfɪʃ.ɪŋ"],
["Encryption","ɪnˈkrɪp.ʃən"],
["Cyberattack","ˈsaɪ.bər əˌtæk"],
["Database","ˈdeɪ.tə.beɪs"],
["Cloud","klaʊd"],
["Server","ˈsɝː.vər"],
["Network","ˈnet.wɝːk"],
["Router","ˈraʊ.tər"],
["Antivirus","ˌæn.tiˈvaɪ.rəs"],
["Spyware","ˈspaɪ.weər"],
["Trojan","ˈtroʊ.dʒən"],
["Backup","ˈbæk.ʌp"],
["Update","ʌpˈdeɪt"],
["Download","ˌdaʊnˈloʊd"],
["Upload","ˈʌp.loʊd"],
["Digital","ˈdɪdʒ.ə.təl"],
["Software","ˈsɔːft.weər"],
["Hardware","ˈhɑːrd.weər"],
["Algorithm","ˈæl.ɡə.rɪð.əm"],
["Authentication","ɔːˌθen.tɪˈkeɪ.ʃən"],
["Cybersecurity","ˌsaɪ.bər sɪˈkjʊr.ə.ti"],
["Spam","spæm"],
["IP address","ˌaɪˈpiː əˈdres"],
["Domain","doʊˈmeɪn"],
["Link","lɪŋk"],
["Website","ˈweb.saɪt"],
["Browser","ˈbraʊ.zər"],
["Cookie","ˈkʊk.i"],
["VPN","ˌviː.piːˈen"],
["WiFi","ˈwaɪ.faɪ"],
["Bluetooth","ˈbluː.tuːθ"],
["Monitor","ˈmɒn.ɪ.tər"],
["Keyboard","ˈkiː.bɔːrd"],
["Mouse","maʊs"],
["Screen","skriːn"],
["Email","ˈiː.meɪl"],
["Attachment","əˈtætʃ.mənt"],
["Folder","ˈfoʊl.dər"],
["File","faɪl"],
["Cybercrime","ˈsaɪ.bər kraɪm"],
["Bot","bɒt"],
["Blockchain","ˈblɒk.tʃeɪn"],
["AI","ˌeɪˈaɪ"],
["Robot","ˈroʊ.bɒt"],
["Data","ˈdeɪ.tə"],
["Code","koʊd"],
["Program","ˈproʊ.ɡræm"],
["Developer","dɪˈvel.ə.pər"],
["System","ˈsɪs.təm"],
["Access","ˈæk.ses"],
["Security","sɪˈkjʊr.ə.ti"],
["Threat","θret"],
["Risk","rɪsk"],
["Protection","prəˈtek.ʃən"]
];

const container = document.getElementById("wordList");

words.forEach(word => {
    const div = document.createElement("div");
    div.className = "word";
    div.innerHTML = `
        <span><strong>${word[0]}</strong> — ${word[1]}</span>
        <button onclick="speak('${word[0]}')">🔊</button>
    `;
    container.appendChild(div);
});

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
