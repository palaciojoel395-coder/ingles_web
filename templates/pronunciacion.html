<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cyber English - Pronunciación</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

/* Diseño tipo app */
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.app-container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.search-box {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 20px;
    font-size: 16px;
}

.word-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.word-card:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.02);
}

.word-card.active {
    background: #ff9800;
}

.word-text {
    text-align: left;
}

.audio-icon {
    font-size: 20px;
}

</style>
</head>

<body>

<header>
    <h1>🔐 Cyber English</h1>
    <a href="{{ url_for('index') }}">
        <button>⬅ Volver</button>
    </a>
</header>

<div class="app-container">

<input type="text" class="search-box" placeholder="Buscar palabra..." onkeyup="filterWords()">

<div id="wordList"></div>

</div>

<footer>
<p>© 2026 Yoel Palacio Juarez</p>
</footer>

<script>

const words = [
["Computer","Computadora"],
["Internet","Internet"],
["Software","Software"],
["Hardware","Hardware"],
["Server","Servidor"],
["Network","Red"],
["Database","Base de datos"],
["Cloud","Nube"],
["System","Sistema"],
["Application","Aplicación"],
["Programming","Programación"],
["Developer","Desarrollador"],
["Code","Código"],
["Algorithm","Algoritmo"],
["Data","Datos"],
["Digital","Digital"],
["Platform","Plataforma"],
["Device","Dispositivo"],
["Router","Router"],
["Firewall","Cortafuegos"],
["Cybersecurity","Ciberseguridad"],
["Hacker","Hacker"],
["Malware","Malware"],
["Virus","Virus"],
["Phishing","Phishing"],
["Ransomware","Ransomware"],
["Encryption","Encriptación"],
["Password","Contraseña"],
["Authentication","Autenticación"],
["Authorization","Autorización"],
["Threat","Amenaza"],
["Attack","Ataque"],
["Data Breach","Fuga de datos"],
["Spyware","Software espía"],
["Trojan","Troyano"],
["Security","Seguridad"],
["Access","Acceso"],
["Backup","Copia de seguridad"],
["Identity","Identidad"],
["Biometrics","Biometría"],
["Vulnerability","Vulnerabilidad"],
["Exploit","Exploit"],
["Patch","Parche"],
["Update","Actualización"],
["Cybercrime","Ciberdelito"],
["Dark Web","Web oscura"],
["IP Address","Dirección IP"],
["Domain","Dominio"],
["Hosting","Hosting"],
["Protocol","Protocolo"],
["HTTP","HTTP"],
["HTTPS","HTTPS"],
["VPN","VPN"],
["Bandwidth","Ancho de banda"],
["Upload","Subir"],
["Download","Descargar"],
["Administrator","Administrador"],
["Root","Usuario root"],
["Linux","Linux"],
["Windows","Windows"],
["MacOS","MacOS"],
["Terminal","Terminal"],
["Command","Comando"],
["Script","Script"],
["Debug","Depurar"],
["Bug","Error"],
["Cloud Security","Seguridad en la nube"],
["Penetration Testing","Prueba de penetración"],
["Zero Day","Día cero"],
["Data Center","Centro de datos"],
["Monitoring","Monitoreo"],
["Digital Forensics","Forense digital"],
["Source Code","Código fuente"],
["Artificial Intelligence","Inteligencia Artificial"],
["Machine Learning","Aprendizaje automático"],
["Big Data","Macrodatos"],
["Blockchain","Blockchain"],
["Smart Contract","Contrato inteligente"],
["Encryption Key","Clave de encriptación"],
["Hash","Hash"],
["Token","Token"],
["Cyber Attack","Ataque cibernético"],
["Incident Response","Respuesta a incidentes"],
["Security Policy","Política de seguridad"],
["Cloud Computing","Computación en la nube"],
["Two-Factor Authentication","Autenticación de dos factores"],
["Multi-Factor Authentication","Autenticación multifactor"],
["Risk Assessment","Evaluación de riesgos"],
["Cyber Defense","Defensa cibernética"],
["Digital Identity","Identidad digital"],
["Security Audit","Auditoría de seguridad"],
["Intrusion Detection","Detección de intrusos"],
["Endpoint","Punto final"],
["Data Protection","Protección de datos"]
];

const wordList = document.getElementById("wordList");

function displayWords(list){
    wordList.innerHTML="";
    list.forEach(word=>{
        const div=document.createElement("div");
        div.className="word-card";
        div.innerHTML=`
            <div class="word-text">
                <strong>${word[0]}</strong><br>
                <small>${word[1]}</small>
            </div>
            <div class="audio-icon">🎧</div>
        `;
        div.onclick=()=>speak(word[0],div);
        wordList.appendChild(div);
    });
}

function speak(word,element){
    const utter=new SpeechSynthesisUtterance(word);
    utter.lang="en-US";
    utter.rate=0.9;
    window.speechSynthesis.speak(utter);

    document.querySelectorAll(".word-card").forEach(card=>card.classList.remove("active"));
    element.classList.add("active");
}

function filterWords(){
    const input=document.querySelector(".search-box").value.toLowerCase();
    const filtered=words.filter(word=>word[0].toLowerCase().includes(input));
    displayWords(filtered);
}

displayWords(words);

</script>

</body>
</html>
