<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz Cyber English</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.quiz-container{
    max-width:700px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.option-btn{
    display:block;
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.option-btn:hover{
    transform:scale(1.02);
}

.correct{
    background-color:#4CAF50;
    color:white;
}

.wrong{
    background-color:#f44336;
    color:white;
}

.result{
    margin-top:15px;
    font-weight:bold;
    font-size:18px;
}

.next-btn{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🧠 Cyber English Quiz</h1>
<a href="{{ url_for('inicio') }}">
<button>⬅ Volver</button>
</a>
</header>

<div class="quiz-container">
    <h2 id="question"></h2>
    <div id="options"></div>
    <div class="result" id="result"></div>
    <button class="next-btn" id="nextBtn" style="display:none;">Siguiente</button>
</div>

<script>

const questions = [
{
    word: "Hacker",
    options: ["Programador", "Hacker", "Servidor"],
    correctIndex: 1
},
{
    word: "Firewall",
    options: ["Virus", "Cortafuegos", "Contraseña"],
    correctIndex: 1
},
{
    word: "Database",
    options: ["Red", "Base de datos", "Encriptación"],
    correctIndex: 1
}
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionElement = document.getElementById("question");
const optionsContainer = document.getElementById("options");
const resultElement = document.getElementById("result");
const nextBtn = document.getElementById("nextBtn");

function loadQuestion(){

    answered = false;
    resultElement.innerText = "";
    nextBtn.style.display = "none";
    optionsContainer.innerHTML = "";

    const q = questions[currentQuestion];
    questionElement.innerText = "Word: " + q.word;

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.classList.add("option-btn");
        button.innerText = option;

        button.onclick = () => checkAnswer(index, button);

        optionsContainer.appendChild(button);
    });
}

function checkAnswer(index, button){

    if(answered) return; // 🔥 SOLO UNA OPORTUNIDAD

    answered = true;

    const buttons = document.querySelectorAll(".option-btn");
    const correctIndex = questions[currentQuestion].correctIndex;

    buttons.forEach(btn => btn.disabled = true);

    if(index === correctIndex){
        button.classList.add("correct");
        resultElement.innerText = "✅ Correct!";
        score++;
    } else {
        button.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");
        resultElement.innerText = "❌ Incorrect!";
    }

    nextBtn.style.display = "inline-block";
}

nextBtn.onclick = () => {
    currentQuestion++;

    if(currentQuestion < questions.length){
        loadQuestion();
    } else {
        showFinalResult();
    }
};

function showFinalResult(){
    questionElement.innerText = "🎯 Quiz Finalizado";
    optionsContainer.innerHTML = "";
    resultElement.innerText = "Tu puntuación: " + score + " / " + questions.length;

    nextBtn.style.display = "none";
}

loadQuestion();

</script>

</body>
</html>
