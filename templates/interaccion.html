<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cyber English Quiz</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.quiz-container{
    max-width:700px;
    margin:auto;
    padding:20px;
    text-align:center;
}

.level-display{
    font-size:18px;
    margin-bottom:10px;
    font-weight:bold;
}

.option-btn{
    display:block;
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.option-btn:hover{
    transform:scale(1.02);
}

.correct{
    background-color:#4CAF50;
    color:white;
}

.wrong{
    background-color:#f44336;
    color:white;
}

.result{
    margin-top:15px;
    font-weight:bold;
    font-size:18px;
}

.next-btn{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
    border:none;
    border-radius:6px;
}

.score{
    margin-top:10px;
    font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>🧠 Cyber English Quiz</h1>
<a href="{{ url_for('inicio') }}">
<button>⬅ Volver</button>
</a>
</header>

<div class="quiz-container">

    <div class="level-display" id="levelDisplay"></div>

    <h2 id="question"></h2>
    <div id="options"></div>

    <div class="result" id="result"></div>
    <div class="score" id="score"></div>

    <button class="next-btn" id="nextBtn" style="display:none;">
        Siguiente
    </button>

</div>

<script>

const levels = {

1: [
{word:"Hacker", options:["Programador","Hacker","Servidor"], correctIndex:1},
{word:"Server", options:["Servidor","Virus","Red"], correctIndex:0}
],

2: [
{word:"Firewall", options:["Virus","Cortafuegos","Base de datos"], correctIndex:1},
{word:"Encryption", options:["Encriptación","Red","Hosting"], correctIndex:0}
],

3: [
{word:"Vulnerability", options:["Protección","Debilidad","Contraseña"], correctIndex:1},
{word:"Penetration Testing", options:["Prueba de penetración","Ataque DDoS","Firewall"], correctIndex:0}
]

};

let currentLevel = 1;
let currentQuestionIndex = 0;
let score = 0;
let answered = false;

const levelDisplay = document.getElementById("levelDisplay");
const questionElement = document.getElementById("question");
const optionsContainer = document.getElementById("options");
const resultElement = document.getElementById("result");
const nextBtn = document.getElementById("nextBtn");
const scoreElement = document.getElementById("score");

function loadQuestion(){

    answered = false;
    resultElement.innerText = "";
    nextBtn.style.display = "none";
    optionsContainer.innerHTML = "";

    const levelQuestions = levels[currentLevel];

    if(currentQuestionIndex >= levelQuestions.length){
        currentQuestionIndex = 0;
    }

    const q = levelQuestions[currentQuestionIndex];

    levelDisplay.innerText = "Nivel actual: " + currentLevel;
    questionElement.innerText = "Word: " + q.word;

    q.options.forEach((option, index) => {

        const button = document.createElement("button");
        button.classList.add("option-btn");
        button.innerText = option;

        button.onclick = () => checkAnswer(index, button);

        optionsContainer.appendChild(button);
    });

    scoreElement.innerText = "Puntuación: " + score;
}

function checkAnswer(index, button){

    if(answered) return; // 🔥 solo una oportunidad

    answered = true;

    const buttons = document.querySelectorAll(".option-btn");
    const correctIndex = levels[currentLevel][currentQuestionIndex].correctIndex;

    buttons.forEach(btn => btn.disabled = true);

    if(index === correctIndex){

        button.classList.add("correct");
        resultElement.innerText = "✅ Correcto! Subes de nivel 🔥";
        score++;

        if(currentLevel < 3){
            currentLevel++;
        }

    } else {

        button.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");
        resultElement.innerText = "❌ Incorrecto. Bajas de nivel.";

        if(currentLevel > 1){
            currentLevel--;
        }
    }

    scoreElement.innerText = "Puntuación: " + score;
    nextBtn.style.display = "inline-block";
}

nextBtn.onclick = () => {

    currentQuestionIndex++;
    loadQuestion();
};

loadQuestion();

</script>

</body>
</html>
